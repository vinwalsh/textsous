  "name": "Toasted Oat Porridge with Brown Butter Apples",
  "author": { "@type": "Person", "name": "TextSous Kitchen" },
  "recipeYield": "2 servings",
  "recipeIngredient": [
    "1 cup rolled oats",
    "2 cups whole milk",
    "1 tablespoon unsalted butter",
    "1 medium apple, diced",
    "2 tablespoons brown sugar",
    "1/4 teaspoon ground cinnamon",
    "1 pinch fine sea salt"
  ],
  "recipeInstructions": [
    {
      "@type": "HowToStep",
      "text": "Toast the rolled oats in a dry saucepan over medium heat for 2 minutes, until fragrant."
    },
    {
      "@type": "HowToSection",
      "name": "Apples",
      "itemListElement": [
        { "@type": "HowToStep", "text": "Melt the butter in a small skillet until it foams and smells nutty." },
        { "@type": "HowToStep", "text": "Add the diced apple, brown sugar, and cinnamon; cook 5 minutes until soft." }
      ]
    },
    {
      "@type": "HowToStep",
      "text": "Pour the milk over the oats, add the salt, and simmer 6 minutes, stirring often."
    },
    { "@type": "HowToStep", "text": "Spoon into bowls and top with the brown butter apples." }
  ]
}
</script>
